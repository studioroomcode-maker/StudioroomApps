<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TikTok Authorization — HelloWords Auto Poster</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:60px auto;padding:0 20px;line-height:1.7;color:#1a1a1a;text-align:center;}
h1{font-size:1.4rem;}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1rem;background:#f3f3f3;border:1px solid #ddd;border-radius:8px;padding:14px 16px;word-break:break-all;margin:18px 0;}
button{font-size:1rem;padding:10px 22px;border:0;border-radius:8px;background:#0a66c2;color:#fff;cursor:pointer;}
button:active{transform:translateY(1px);}
.err{color:#c0392b;}
small{color:#666;}
</style>
</head>
<body>
<h1>TikTok Authorization</h1>
<div id="out"></div>
<script>
const p = new URLSearchParams(location.search);
const code = p.get('code');
const err = p.get('error');
const out = document.getElementById('out');
if (err) {
  out.innerHTML = '<p class="err">Authorization failed: ' + err + ' — ' + (p.get('error_description')||'') + '</p>';
} else if (code) {
  out.innerHTML =
    '<p>Authorization successful. Copy this code and paste it back into the terminal:</p>' +
    '<div class="code" id="c">' + code + '</div>' +
    '<button onclick="navigator.clipboard.writeText(document.getElementById(\'c\').textContent).then(()=>{this.textContent=\'Copied!\'})">Copy code</button>' +
    '<p><small>state: ' + (p.get('state')||'(none)') + '</small></p>';
} else {
  out.innerHTML = '<p>This page receives the TikTok OAuth redirect. No authorization code found in the URL.</p>';
}
</script>
</body>
</html>
